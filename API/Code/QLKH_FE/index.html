<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <title>Title</title>
</head>
<body>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="MaKhach">Mã Khách</label>
                <input type="text" class="form-control" id="MaKhach">
            </div>
            <div class="form-group">
                <label for="TenKhach">Tên Khách</label>
                <input type="text" class="form-control" id="TenKhach">
            </div>
            <div class="form-group">
                <label for="DiaChi">Địa Chỉ</label>
                <input type="text" class="form-control" id="DiaChi">
            </div>
            <div class="form-group">
                <label for="DienThoai">Điện Thoại</label>
                <input type="text" class="form-control" id="DienThoai">
            </div>
            <button type="button" class="btn btn-primary" onclick="AddCustomer()">Thêm Khách Hàng</button>
            <button type="button" class="btn btn-primary" onclick="UpdateCustomer()">Sửa Khách Hàng</button>
            <button type="button" class="btn btn-primary" onclick="GetAllCustomers()">Tất Cả Khách Hàng</button>
            <button type="button" class="btn btn-primary" onclick="FindCustomer()">Tìm Kiếm Khách Hàng Theo Tên</button>
        </form>
        <table id="KhachHang" class="table table-striped table-bordered">
            <thead class="thead-light">
                <tr>
                    <th>Mã Khách</th>
                    <th>Tên Khách</th>
                    <th>Địa Chỉ</th>
                    <th>Điện Thoại</th>
                    <th>Xóa</th>
                    <th>Sửa</th>
                </tr>
            </thead>
            <tbody id="allKH"></tbody>
        </table>
    </div>
</body>
</html>
<script type="text/javascript">
    $.ajaxSetup({
        crossDomain: true
    });
    
    let url = 'http://127.0.0.1:9999/';
    $(document).ready(function () {
        GetAllCustomers();
    });
    function GetAllCustomers() {
        $.ajax({
            url: url + 'kh/getall',
            method: 'GET',
            contentType: 'json',
            dataType: 'json',
            error: function (res) {
                console.log(res);
            },
            success: function (res) {
                const len = res.length;
                console.log(res);
                let table = '';
                for (var i = 0; i < len; ++i) {
                    table = table + '<tr>';
                    table = table + '<td>' + res[i].maKhach + '</td>';
                    table = table + '<td>' + res[i].tenKhach + '</td>';
                    table = table + '<td>' + res[i].diaChi + '</td>';
                    table = table + '<td>' + res[i].dienThoai + '</td>';
                    table = table + '<td> <button type="button" class="btn btn-warning" onclick="GetCustomer(\'' + res[i].maKhach + '\')">Edit</button> </td>';
                    table = table + '<td> <button type="button" class="btn btn-danger" onclick="DeleteCustomer(\'' + res[i].maKhach + '\')">Delete</button> </td>';
                    table = table + '</tr>';
                }
                document.getElementById('allKH').innerHTML = table;
            },
            fail: function (response) { }

        })
    }
    function AddCustomer() {
        $.ajax({
            url: url + 'kh/add' + "?MaKhach=" + $("#MaKhach").val() + "&TenKhach=" + $("#TenKhach").val() + "&DiaChi=" + $("#DiaChi").val() + "&DienThoai=" + $("#DienThoai").val(),
            method: "POST",
            contentType: 'json',
            dataType: 'json',
            error: function (res) {
                alert("Them moi khong thanh cong");
            },
            success: function (res) {
                alert("Them moi thanh cong");
                console.log()
                GetAllCustomers();
            },
            fail: function (response) { }
        })
    }
    function GetCustomer(id) {
        $.ajax({
            url: url + "kh/getbyid/" + id,
            method: 'GET',
            contentType: 'json',
            dataType: 'json',
            error: function (res) {

            },
            success: function (res) {
                console.log(res);
                $("#MaKhach").val(res.maKhach),
                    $("#TenKhach").val(res.tenKhach),
                    $("#DiaChi").val(res.diaChi),
                    $("#DienThoai").val(res.dienThoai)
            },
            fail: function (response) { }

        })
    }
    function FindCustomer() {
        $.ajax({
            url: url + "kh/search/" + $("#TenKhach").val(),
            method: 'GET',
            contentType: 'json',
            dataType: 'json',
            error: function (res) {

            },
            success: function (res) {
                $("#allKH").empty();
                const len = res.length;
                console.log(res);
                let table = '';
                for (var i = 0; i < len; ++i) {
                    table = table + '<tr>';
                    table = table + '<td>' + res[i].maKhach + '</td>';
                    table = table + '<td>' + res[i].tenKhach + '</td>';
                    table = table + '<td>' + res[i].diaChi + '</td>';
                    table = table + '<td>' + res[i].dienThoai + '</td>';
                    table = table + '<td> <button type="button" class="btn btn-danger" onclick="DeleteCustomer(\'' + res[i].maKhach + '\')">Delete</button> </td>';
                    table = table + '<td> <button type="button" class="btn btn-warning" onclick="GetCustomer(\'' + res[i].maKhach + '\')">Edit</button> </td>';
                    table = table + '</tr>';
                }
                document.getElementById('allKH').innerHTML = table;
            },
            fail: function (response) { }

        })
    }
    function UpdateCustomer() {
        $.ajax({
            url: url + 'kh/update' + "?MaKhach=" + $("#MaKhach").val() + "&TenKhach=" + $("#TenKhach").val() + "&DiaChi=" + $("#DiaChi").val() + "&DienThoai=" + $("#DienThoai").val(),
            method: "PUT",
            contentType: 'json',
            dataType: 'json',
            error: function (res) {
                alert("Sua khong thanh cong");
            },
            success: function (res) {
                alert("Sua thanh cong");
                GetAllCustomers();
            },
            fail: function (response) { }
        })
    }
    function DeleteCustomer(id) {
        $.ajax({
            url: url + "kh/delete/" + id,
            method: "DELETE",
            contentType: 'json',
            dataType: 'json',
            error: function (res) {
                alert("Xoa khong thanh cong");
            },
            success: function (res) {
                alert("Xoa thanh cong");
                GetAllCustomers();
            },
            fail: function (response) { }
        })
    }
</script>
